name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Required checks must also report on a merge queue's gh-readonly-queue/** ref, or a queued
  # PR waits until the queue times it out.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

  # The npm launcher is a plain Node shim with no dependencies; its tests run on the
  # Node the runner ships.
  npm-shim:
    name: npm shim
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: node --test
        working-directory: npm
        run: npm test

  # The Bundu floor `mz floor` enforces is read from the Mzizi token source, never typed here:
  # src/floor/generated.rs must equal what the generator makes from the registry's tokens.css at
  # the commit it names.
  floor-tokens:
    name: floor tokens
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Regenerate and compare
        run: |
          set -euo pipefail
          sha=$(sed -n 's/^pub const SOURCE_SHA: &str = "\([0-9a-f]\{40\}\)";$/\1/p' src/floor/generated.rs)
          curl -fsSL "https://raw.githubusercontent.com/mzizi-dev/mzizi-registry/${sha}/styles/pattern/tokens.css" -o "$RUNNER_TEMP/tokens.css"
          node scripts/generate-floor-tokens.mjs --from "$RUNNER_TEMP/tokens.css" --sha "$sha" --check
